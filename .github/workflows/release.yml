name: Release

# Publishes @answerlayer/cli to npm when a GitHub Release is published.
#
# Uses npm Trusted Publishing (OIDC) — no token or secret required. The trusted
# publisher must be configured once on npmjs.com for @answerlayer/cli:
# GitHub Actions → AnswerLayer/answerlayer-cli → workflow release.yml.
# Provenance is attached automatically.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      # Trusted Publishing needs npm >= 11.5.1 (Node 22 ships npm 10).
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm test
      # Fail early if the release tag (e.g. v0.1.0) doesn't match package.json.
      - name: Verify version matches tag
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "package.json version ($PKG_VERSION) does not match release tag ($TAG_VERSION)" >&2
            exit 1
          fi
      - run: npm publish
