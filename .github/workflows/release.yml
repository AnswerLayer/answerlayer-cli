name: Release

# On every push to main, semantic-release derives the next version from commit
# messages, publishes @answerlayer/cli to npm via Trusted Publishing (OIDC — no
# token), and creates the git tag + GitHub Release. Provenance is automatic.
#
# Bump policy (scripts/semantic-release-bump.js): everything defaults to a
# patch; `feat(minor):` -> minor; `type!:` / BREAKING CHANGE -> major.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create tags + GitHub Releases
      issues: write # semantic-release release comments
      pull-requests: write # semantic-release release comments
      id-token: write # npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release needs full history + tags
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      # Trusted Publishing needs npm >= 11.5.1 (Node 22 ships npm 10).
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm test
      # Pinned to an exact version for reproducible release runs. Keeps the
      # package dependency-free (semantic-release is not a devDependency).
      - run: npx --yes semantic-release@24.2.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
